<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2319"/>
      <stop offset="50%" stop-color="#143628"/>
      <stop offset="100%" stop-color="#091b13"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1f543e" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#143628" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#091b13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edd49a"/>
      <stop offset="50%" stop-color="#d3ad76"/>
      <stop offset="100%" stop-color="#b88d50"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d3ad76" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#d3ad76" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d3ad76" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="subtleGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#subtleGrid)"/>
  <rect width="800" height="500" fill="url(#glowGrad)"/>

  <!-- Elegant Inner Border -->
  <rect x="24" y="24" width="752" height="452" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Corner Flourishes -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.6">
    <path d="M 36 48 L 48 48 L 48 36"/>
    <path d="M 764 48 L 752 48 L 752 36"/>
    <path d="M 36 452 L 48 452 L 48 464"/>
    <path d="M 764 452 L 752 452 L 752 464"/>
  </g>

  <!-- Central Icon Badge -->
  <g transform="translate(400, 165)">
    <!-- Outer Ring -->
    <circle r="52" fill="rgba(255,255,255,0.03)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle r="45" fill="rgba(9,27,19,0.7)" stroke="rgba(211,173,118,0.25)" stroke-width="1"/>

    <!-- Subtle Star Above -->
    <path d="M 0 -34 L 1.8 -29.5 L 6.5 -29 L 3 -25.5 L 4 -21 L 0 -23.2 L -4 -21 L -3 -25.5 L -6.5 -29 L -1.8 -29.5 Z" fill="url(#goldGrad)"/>

    <!-- Hotel/Villa Architectural Icon -->
    <!-- Roof Peak -->
    <path d="M -26 2 L 0 -20 L 26 2" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Overhang -->
    <path d="M -30 2 L 30 2" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Building Body -->
    <path d="M -22 2 L -22 24 L 22 24 L 22 2" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Arched Portal Doorway -->
    <path d="M -8 24 L -8 11 Q 0 5 8 11 L 8 24 Z" stroke="url(#goldGrad)" stroke-width="1.5" fill="rgba(211,173,118,0.18)"/>
    <!-- Windows -->
    <rect x="-18" y="8" width="6" height="7" rx="1" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <rect x="12" y="8" width="6" height="7" rx="1" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  </g>

  <!-- Typography -->
  <!-- Eyebrow -->
  <text x="400" y="260" text-anchor="middle" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#d3ad76">EXPLORE LANKA • STAYS</text>

  <!-- Headline -->
  <text x="400" y="306" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#ffffff" letter-spacing="0.5">Photo Coming Soon</text>

  <!-- Subtitle -->
  <text x="400" y="342" text-anchor="middle" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#a4baa9" letter-spacing="0.2">Official property photography is being updated</text>

  <!-- Pill Badge -->
  <g transform="translate(400, 385)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(211,173,118,0.32)" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#edd49a">VERIFIED PROPERTY</text>
  </g>
</svg>
